<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino dig mockup</title>
<style>
@font-face { font-family: 'Jersey 10'; src: url('../fonts/jersey-10-latin-400-normal.woff2') format('woff2'); }
html, body { margin: 0; height: 100%; background: #1b1430; color: #fff; font-family: 'Jersey 10', system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; gap: 8px; align-items: center; padding: 0 10px; background: #2b2146; z-index: 5; font-size: 18px; flex-wrap: nowrap; overflow-x: auto; }
#bar select, #bar button { font: inherit; font-size: 17px; background: #ffd43b; color: #1b1430; border: 2px solid #1b1430; border-radius: 6px; padding: 2px 8px; }
#bar button.alt { background: #e9ecef; }
#stage { position: fixed; top: 44px; left: 0; right: 0; bottom: 0; display: grid; place-items: center; background: #3a2e5a; }
#wrap { position: relative; }
#wrap canvas { position: absolute; inset: 0; display: block; }
#field { image-rendering: pixelated; }
#book, #house { position: fixed; inset: 44px 0 0 0; background: #f4ead0; color: #1b1430; display: none; overflow: auto; z-index: 4; padding: 14px; box-sizing: border-box; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { font: inherit; font-size: 18px; border: 2px solid #1b1430; background: #fff; border-radius: 6px; padding: 2px 10px; }
.tabs button.on { background: #ffd43b; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: #fff; border: 3px solid #1b1430; border-radius: 8px; padding: 8px; text-align: center; font-size: 18px; cursor: pointer; }
.card canvas, .page canvas { image-rendering: pixelated; }
.card.missing { opacity: 0.55; }
.page { background: #fff; border: 3px solid #1b1430; border-radius: 10px; padding: 14px; max-width: 760px; margin: 0 auto; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.4; }
.page h2 { font-family: 'Jersey 10', system-ui; font-size: 32px; margin: 0 0 4px; }
.page .bones { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
.page .bone { border: 2px solid #ced4da; border-radius: 6px; padding: 6px; display: flex; gap: 8px; align-items: flex-start; }
.page .bone.no { opacity: 0.5; }
.page .facts td { padding: 2px 8px 2px 0; vertical-align: top; }
.page .facts td:first-child { font-weight: 700; white-space: nowrap; }
.back { font: inherit; font-size: 18px; margin-bottom: 8px; }
</style></head>
<body>
<div id="bar">
  <b>Dino dig</b>
  <select id="map"></select>
  <select id="tier"><option value="1">Shovel</option><option value="2">Steel spade</option><option value="3">Golden shovel</option></select>
  <button id="go">New dig</button>
  <button id="bookBtn" class="alt">Dig book</button>
  <button id="houseBtn" class="alt">House</button>
  <button id="reset" class="alt">Fresh start</button>
</div>
<div id="stage"><div id="wrap"><canvas id="field"></canvas><canvas id="hud"></canvas></div></div>
<div id="book"></div>
<div id="house"></div>
<script type="module" src="dig-mock.js"></script>
</body></html>
