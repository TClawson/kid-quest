name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys from main queue up in one group. Each PR gets its own group, so a PR
# push never cancels a deploy that is running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (app loads, opens a kid, ticks a task)
        run: npm run test:smoke
      - name: Security rules tests
        run: npm run test:rules
      - name: Family sync end to end
        run: npm run test:e2e

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons fonts _site/
      - name: Name the offline cache after this commit
        run: |
          sed -i "s/const CACHE = 'kid-quest-dev';/const CACHE = 'kid-quest-${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "kid-quest-${GITHUB_SHA::12}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
